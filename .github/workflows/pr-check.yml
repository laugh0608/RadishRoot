{
  "name": "PR Checks",
  "on": {
    "pull_request": {
      "branches": [
        "dev",
        "master"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "repo-hygiene": {
      "name": "Repo Hygiene",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Checkout candidate merge",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Check repository",
          "shell": "bash",
          "env": {
            "BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "if [[ -n \"$BASE_SHA\" ]]; then\n  python3 scripts/check-repo.py --base-ref \"$BASE_SHA\"\nelse\n  python3 scripts/check-repo.py\nfi"
        },
        {
          "name": "Test rejection paths",
          "run": "python3 -B -m unittest discover -s scripts/tests -v"
        }
      ]
    },
    "candidate-quality": {
      "name": "Candidate Quality",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 2,
      "if": "${{ always() }}",
      "needs": [
        "repo-hygiene"
      ],
      "steps": [
        {
          "name": "Require every component to succeed",
          "shell": "bash",
          "env": {
            "NEEDS_JSON": "${{ toJSON(needs) }}"
          },
          "run": "python3 - <<'PYTHON'\nimport json\nimport os\nimport sys\nneeds = json.loads(os.environ[\"NEEDS_JSON\"])\nok = bool(needs) and all(job.get(\"result\") == \"success\" for job in needs.values())\nprint(json.dumps({name: job.get(\"result\", \"missing\") for name, job in needs.items()}))\nsys.exit(0 if ok else 1)\nPYTHON"
        }
      ]
    }
  }
}
