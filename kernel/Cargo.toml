[package]
name = "radishroot-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "radishroot-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = { version = "=0.6.5", default-features = false }
uart_16550 = { version = "=0.9.0", default-features = false }
gpt_disk_io = { version = "=0.17.0", default-features = false }

fatfs = { git = "https://github.com/rafalh/rust-fatfs.git", rev = "38b3a7950bf0e765e34286d1dfe76c519ee347e2", default-features = false, features = ["alloc", "lfn", "unicode"] }

[features]
boot-test = []

[target.'cfg(target_os = "none")'.dependencies]
x86_64 = { version = "=0.15.5", default-features = false, features = ["instructions"] }
linked_list_allocator = { version = "=0.10.6", default-features = false }
virtio-drivers = { version = "=0.13.0", default-features = false }
